name: Setup Node and lockfile install
description: Enable the repo-pinned npm via Corepack and install from package-lock.json.
inputs:
  node-version:
    required: true
    description: Node.js version to install.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Enable Corepack
      shell: bash
      run: corepack enable
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
