name: Main scaffold lock closure

on:
  push:
    branches:
      - feat/main-package-scaffold
    paths:
      - ".github/workflows/main-scaffold-lock.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scaffold branch
        uses: actions/checkout@v6
        with:
          ref: feat/main-package-scaffold

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Refresh workspace lock metadata only
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/main-scaffold-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/main-scaffold-lock.yml
          git commit -m "chore(main): register workspace in lockfile"
          git push origin HEAD:feat/main-package-scaffold
