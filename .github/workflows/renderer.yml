name: Renderer package

on:
  pull_request:
    paths:
      - "packages/renderer/**"
      - "packages/renderer-control/**"
      - "packages/data/**"
      - "packages/platform-ports/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/renderer.yml"
      - ".github/actions/setup-workspace/**"
  push:
    branches: [main]
    paths:
      - "packages/renderer/**"
      - "packages/renderer-control/**"
      - "packages/data/**"
      - "packages/platform-ports/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/renderer.yml"
      - ".github/actions/setup-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
      - name: Build dependencies
        run: >-
          npm run build
          -w @loomrealm/foundation
          -w @loomrealm/wire
          -w @loomrealm/platform-ports
          -w @loomrealm/data
          -w @loomrealm/renderer-control
      - name: Test Renderer
        run: npm test -w @loomrealm/renderer
      - name: Verify publishable package surface
        run: npm pack -w @loomrealm/renderer --dry-run
