name: Refresh platform-ports M4 lock once

on:
  push:
    branches:
      - feat/platform-ports-m4

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/platform-ports-m4
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pinned npm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable npm
          test "$(npm --version)" = "10.9.2"
      - name: Refresh workspace lock metadata
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(platform-ports): sync M4 lock metadata"
          git push origin HEAD:feat/platform-ports-m4
