name: Core packages

on:
  pull_request:
    paths:
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/core-packages.yml"
      - ".github/actions/setup-workspace/**"
  push:
    branches:
      - main
    paths:
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/core-packages.yml"
      - ".github/actions/setup-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}

      - name: Run Foundation and Wire conformance
        run: npm run test:core-packages

      - name: Verify publishable package surfaces
        run: |
          npm pack -w @loomrealm/foundation --dry-run
          npm pack -w @loomrealm/wire --dry-run
