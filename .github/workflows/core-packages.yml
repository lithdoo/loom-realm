name: Core packages

on:
  pull_request:
    paths:
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-packages.yml"
  push:
    branches:
      - main
    paths:
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/core-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Foundation and Wire conformance
        run: npm run test:core-packages

      - name: Verify publishable package surfaces
        run: |
          npm pack -w @loomrealm/foundation --dry-run
          npm pack -w @loomrealm/wire --dry-run
