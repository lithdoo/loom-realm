name: One-time root milestone migration

on:
  push:
    branches: [docs/remove-root-milestone-reports]
    paths:
      - .github/workflows/root-doc-migration-once.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'lithdoo/loom-realm' && github.ref == 'refs/heads/docs/remove-root-milestone-reports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify original main base
        shell: bash
        run: |
          git merge-base --is-ancestor 2d465b8c8501566b26375dae55e1a78007606c40 HEAD
      - name: Execute root cleanup and check diff
        shell: bash
        run: |
          python3 scripts/relocate-root-milestones.py
          git diff --check
          test "$(find . -maxdepth 1 -type f -name 'M[0-9]*_*.md' | wc -l)" -eq 0
          test ! -f M15_HOSTRA_DESKTOP_RECOMPOSITION_PLAN.md
      - name: Build documentation with strict links
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - shell: bash
        run: |
          npm run docs:check-links
          npm run docs:build
      - name: Commit only into the dedicated cleanup branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'docs: remove 46 root milestones and migrate all active references'
          git push origin HEAD:refs/heads/docs/remove-root-milestone-reports
