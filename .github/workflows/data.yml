name: Renderer Data conformance

on:
  pull_request:
    paths:
      - "packages/data/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/data.yml"
      - ".github/actions/setup-workspace/**"
  push:
    branches: [main]
    paths:
      - "packages/data/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/data.yml"
      - ".github/actions/setup-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
      - name: Run Foundation, Wire, and Data tests
        run: npm run test:data
      - name: Verify publishable package surface
        run: npm pack -w @loomrealm/data --dry-run
