name: Renderer Data conformance

on:
  pull_request:
    paths:
      - "packages/data/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package-lock.json"
      - ".github/workflows/data.yml"
  push:
    branches: [main]
    paths:
      - "packages/data/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package-lock.json"
      - ".github/workflows/data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Normalize npm lock view
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Foundation, Wire, and Data tests
        run: npm test -w @loomrealm/foundation -w @loomrealm/wire -w @loomrealm/data
      - name: Verify publishable package surface
        run: npm pack -w @loomrealm/data --dry-run
