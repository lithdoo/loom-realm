name: Essentials fixture importer

on:
  pull_request:
    paths:
      - "tools/fixtures/essentials-v21.1/**"
      - "packages/fsdb-http/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/essentials-fixture.yml"
      - ".github/actions/setup-workspace/**"
  push:
    branches: [main]
    paths:
      - "tools/fixtures/essentials-v21.1/**"
      - "packages/fsdb-http/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/essentials-fixture.yml"
      - ".github/actions/setup-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Importer conformance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 20

      - name: Test fixture importer
        run: npm run test:fixtures
