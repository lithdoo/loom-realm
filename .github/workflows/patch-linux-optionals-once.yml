name: Patch Linux optional lock entries once

on:
  push:
    branches:
      - fix/data-implementation-review-closure

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/data-implementation-review-closure
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pinned npm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable npm
          test "$(npm --version)" = "10.9.2"
      - name: Add only missing Linux native optional entries
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          const packages = lock.packages;

          const targets = [
            { name: '@esbuild/linux-x64', owner: 'esbuild' },
            { name: '@rollup/rollup-linux-x64-gnu', owner: 'rollup' },
          ];

          const additions = new Map();
          for (const target of targets) {
            const key = `node_modules/${target.name}`;
            if (packages[key]) continue;
            const owner = packages[`node_modules/${target.owner}`];
            if (!owner?.version) throw new Error(`Missing locked ${target.owner} version`);
            const spec = `${target.name}@${owner.version}`;
            const meta = JSON.parse(execFileSync('npm', ['view', spec, '--json'], { encoding: 'utf8' }));
            const entry = {
              version: meta.version,
              resolved: meta.dist?.tarball,
              integrity: meta.dist?.integrity,
              ...(meta.cpu ? { cpu: meta.cpu } : {}),
              dev: true,
              ...(meta.license ? { license: meta.license } : {}),
              optional: true,
              ...(meta.os ? { os: meta.os } : {}),
              ...(meta.libc ? { libc: meta.libc } : {}),
              ...(meta.engines ? { engines: meta.engines } : {}),
            };
            for (const [field, value] of Object.entries(entry)) {
              if (value === undefined) delete entry[field];
            }
            additions.set(key, entry);
          }

          if (additions.size === 0) process.exit(0);
          const merged = {};
          const pending = [...additions.entries()].sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0);
          let index = 0;
          for (const [key, value] of Object.entries(packages)) {
            while (index < pending.length && pending[index][0] < key) {
              merged[pending[index][0]] = pending[index][1];
              index += 1;
            }
            merged[key] = value;
          }
          while (index < pending.length) {
            merged[pending[index][0]] = pending[index][1];
            index += 1;
          }
          lock.packages = merged;
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          EOF
      - name: Verify clean install and docs build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm run docs:build
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "chore: lock Linux native optional packages"
          git push origin HEAD:fix/data-implementation-review-closure
