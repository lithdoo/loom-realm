name: Platform instance documentation closure

on:
  push:
    branches:
      - docs/platform-instance-composition
    paths:
      - "tools/apply-platform-instance-docs.py"
      - ".github/workflows/platform-instance-doc-closure.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v6
        with:
          ref: docs/platform-instance-composition

      - name: Apply documentation closure
        run: python tools/apply-platform-instance-docs.py

      - name: Remove one-shot files and commit
        run: |
          rm tools/apply-platform-instance-docs.py
          rm .github/workflows/platform-instance-doc-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc packages .github/workflows/platform-instance-doc-closure.yml tools/apply-platform-instance-docs.py
          git commit -m "docs(platform): make concrete platform the composition object"
          git push origin HEAD:docs/platform-instance-composition
