name: Deploy PokeMan staging

on:
  workflow_run:
    workflows: ["PokeMan Staging Qualification"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pokeman-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'lithdoo/loom-realm' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, pwa]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - id: freshness
        name: Skip obsolete main commit before build
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current"
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded staging commit: $EXPECTED_SHA (main: $current)"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build PokeMan staging bundle
        if: steps.freshness.outputs.current == 'true'
        run: npm run build:staging -w @loomrealm/pwa
      - id: publishability
        name: Recheck main before publishing
        if: steps.freshness.outputs.current == 'true'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current"
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded staging publication: $EXPECTED_SHA (main: $current)"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the checked commit
        if: steps.publishability.outputs.current == 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          PWA_DATA_ROOT: /run/desktop/mnt/host/f/lab-data/pwa
          PWA_ENGINE_DATA_ROOT: /run/desktop/mnt/host/f/lab-data/pwa
          # HTTP smoke is performed in the Web container. Docker Desktop
          # localhost-only port mappings are not reachable through host.docker.internal.
          PWA_HTTP_PORT: "8787"
          PWA_CANDIDATE_PORT: "8790"
        run: node apps/pwa/scripts/deploy-staging.mjs
