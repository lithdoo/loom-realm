name: Deploy PokeMan staging

# The staging server is updated directly from trusted main pushes.
# Build and HTTP smoke are part of the deploy job itself; do not gate a test
# environment on unrelated whole-repository CI (Hostra/Desktop/etc.).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pokeman-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'lithdoo/loom-realm'
    runs-on: [self-hosted, pwa]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - name: Build PokeMan staging bundle
        run: npm run build:staging -w @loomrealm/pwa
      - name: Publish the checked commit
        env:
          GITHUB_SHA: ${{ github.sha }}
          PWA_DATA_ROOT: /run/desktop/mnt/host/f/lab-data/pwa
          PWA_ENGINE_DATA_ROOT: /run/desktop/mnt/host/f/lab-data/pwa
          # HTTP smoke is performed in the Web container. Docker Desktop
          # localhost-only port mappings are not reachable through host.docker.internal.
          PWA_HTTP_PORT: "8787"
          PWA_CANDIDATE_PORT: "8790"
        run: node apps/pwa/scripts/deploy-staging.mjs
