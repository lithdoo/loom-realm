name: Restore rollup libc lock metadata once

on:
  push:
    branches:
      - docs/platform-ports-draft

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: docs/platform-ports-draft
          fetch-depth: 0
      - name: Restore existing lock metadata
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = lock.packages?.['node_modules/@rollup/rollup-linux-x64-gnu'];
          if (!entry) throw new Error('Missing locked rollup linux entry');
          entry.libc = ['glibc'];
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          EOF
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(platform-ports): preserve existing lock metadata"
          git push origin HEAD:docs/platform-ports-draft
