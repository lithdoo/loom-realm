name: Restore rollup libc once
on:
  push:
    branches: [feat/platform-ports-m4]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/platform-ports-m4
          fetch-depth: 0
      - name: Restore lock metadata
        run: |
          python - <<'PY'
          import json
          p='package-lock.json'
          d=json.load(open(p))
          d['packages']['node_modules/@rollup/rollup-linux-x64-gnu']['libc']=['glibc']
          open(p,'w').write(json.dumps(d, indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(platform-ports): preserve existing lock metadata'
          git push origin HEAD:feat/platform-ports-m4
