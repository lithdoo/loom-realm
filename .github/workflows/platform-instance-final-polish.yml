name: Platform instance final polish

on:
  push:
    branches:
      - docs/platform-instance-composition
    paths:
      - "tools/finalize-platform-instance-docs.py"
      - ".github/workflows/platform-instance-final-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/platform-instance-composition
      - run: python tools/finalize-platform-instance-docs.py
      - run: node scripts/run-python.mjs scripts/check-doc-links.py
      - name: Remove one-shot files and commit
        run: |
          rm tools/finalize-platform-instance-docs.py
          rm .github/workflows/platform-instance-final-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc packages .github/workflows/platform-instance-final-polish.yml tools/finalize-platform-instance-docs.py
          git commit -m "docs(platform): finalize platform instance composition model"
          git push origin HEAD:docs/platform-instance-composition
