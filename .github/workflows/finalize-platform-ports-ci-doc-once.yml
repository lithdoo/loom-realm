name: Finalize platform-ports CI doc once
on:
  push:
    branches: [feat/platform-ports-m4]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/platform-ports-m4
          fetch-depth: 0
      - name: Sync source-workspace build command and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/platform-ports/DESIGN.md')
          s = p.read_text()
          old = 'npm run build -w @loomrealm/platform-ports\nnpm pack -w @loomrealm/platform-ports --dry-run'
          new = 'npm run build -w @loomrealm/foundation -w @loomrealm/platform-ports\nnpm pack -w @loomrealm/platform-ports --dry-run'
          if old not in s:
            raise SystemExit('missing expected CI command block')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/finalize-platform-ports-ci-doc-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/platform-ports/DESIGN.md
          git commit -m 'docs(platform-ports): align source-workspace CI command'
          git push origin HEAD:feat/platform-ports-m4
