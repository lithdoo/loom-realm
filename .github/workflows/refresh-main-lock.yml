name: Refresh Main lockfile

on:
  push:
    branches:
      - feat/main-m5
    paths:
      - ".github/workflows/refresh-main-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/main-m5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/refresh-main-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-main-lock.yml
          git commit -m "chore(main): refresh workspace lockfile"
          git push origin HEAD:feat/main-m5
