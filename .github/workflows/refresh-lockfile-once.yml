name: Refresh lockfile once

on:
  push:
    branches:
      - fix/data-implementation-review-closure

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/data-implementation-review-closure
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Enable pinned npm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable npm
          test "$(npm --version)" = "10.9.2"
      - name: Regenerate lockfile from scratch
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate root lockfile with pinned npm"
          git push origin HEAD:fix/data-implementation-review-closure
