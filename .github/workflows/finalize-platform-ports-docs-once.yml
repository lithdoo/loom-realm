name: Finalize platform-ports docs once

on:
  push:
    branches:
      - feat/platform-ports-m4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/platform-ports-m4
          fetch-depth: 0
      - name: Close platform-ports documentation ownership
        run: python .github/finalize-platform-ports-docs-once.py
      - name: Commit documentation closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/30-implementation/package-architecture.md doc/30-implementation/repository-layout.md doc/30-implementation/phase-1-delivery-plan.md packages/platform-ports/DESIGN.md
          git diff --cached --check
          git commit -m "docs(platform-ports): close ownership and M4 consumer status"
          git push origin HEAD:feat/platform-ports-m4
