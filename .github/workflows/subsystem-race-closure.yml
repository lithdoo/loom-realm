name: Subsystem terminal race closure

on:
  push:
    branches:
      - feat/subsystem-m4
    paths:
      - ".github/workflows/subsystem-race-closure.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/subsystem-m4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 20

      - name: Make Runtime Control terminal classification single-owner
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/subsystem/src/internal/frame-runtime.ts")
          text = path.read_text()

          old_call = '''    this.failRuntime(
                runtimeFailure(
                  outcome.kind === "timeout"
                    ? "RUNTIME_CONTROL_FRAME_TIMEOUT"
                    : outcome.kind === "terminal"
                      ? "RUNTIME_CONTROL_FRAME_TERMINAL"
                      : "RUNTIME_CONTROL_FRAME_DIVERGENCE",
                  "Runtime Control frame.call could not establish a safe continuation",
                ),
              );
              return NEVER;
          '''
          new_call = '''    if (
                outcome.kind === "timeout" ||
                outcome.kind === "terminal" ||
                (outcome.kind === "semantic-error" && outcome.classification === "fatal")
              ) {
                // Runtime Control has already committed the connection terminal.
                // SubsystemHost is the single terminal -> RuntimeFailure mapper.
                return NEVER;
              }

              this.failRuntime(
                runtimeFailure(
                  "RUNTIME_CONTROL_FRAME_DIVERGENCE",
                  "Runtime Control frame.call returned an impossible recoverable outcome",
                ),
              );
              return NEVER;
          '''
          if text.count(old_call) != 1:
              raise SystemExit("frame.call terminal block did not match exactly once")
          text = text.replace(old_call, new_call)

          old_return = '''    if (!this.canAcceptFrames()) return;
              if (result.kind !== "success") {
                this.failRuntime(
                  runtimeFailure(
                    result.kind === "timeout"
                      ? "RUNTIME_CONTROL_FRAME_TIMEOUT"
                      : result.kind === "terminal"
                        ? "RUNTIME_CONTROL_FRAME_TERMINAL"
                        : "RUNTIME_CONTROL_FRAME_DIVERGENCE",
                    "Runtime Control frame.return could not be committed safely",
                  ),
                );
              }
          '''
          new_return = '''    if (!this.canAcceptFrames() || result.kind === "success") return;
              if (
                result.kind === "timeout" ||
                result.kind === "terminal" ||
                (result.kind === "semantic-error" && result.classification === "fatal")
              ) {
                // The Runtime Control terminal watcher owns fatal classification.
                return;
              }

              this.failRuntime(
                runtimeFailure(
                  "RUNTIME_CONTROL_FRAME_DIVERGENCE",
                  "Runtime Control frame.return returned an impossible recoverable outcome",
                ),
              );
          '''
          if text.count(old_return) != 1:
              raise SystemExit("frame.return terminal block did not match exactly once")
          path.write_text(text.replace(old_return, new_return))

          test_path = Path("packages/subsystem/test/runtime.test.mjs")
          tests = test_path.read_text()
          marker = '''test("administrative suspend aborts the Frame and discards a late handler result", async () => {
          '''
          addition = '''test("Runtime Control request timeout has one Host-owned failure classification", async () => {
            const never = new Promise(() => {});
            let failedValue;
            const session = await createSession(
              defineSubsystem(() => ({
                async frame(frame) {
                  await frame.call("blocked", null);
                  return completed(null);
                },
                failed(error) {
                  failedValue = error;
                },
              })),
              {
                async onFrameCall() {
                  await never;
                },
              },
            );

            await session.main.frame.initialize({ frameId: "root", input: null });
            await session.main.frame.activate({ frameId: "root", activationId: "a1" });
            await waitFor(() => session.calls.length === 1, "pending frame.call");

            await assert.rejects(
              session.runtime,
              (error) =>
                error instanceof SubsystemRuntimeFatalError &&
                error.failure.code === "RUNTIME_CONTROL_REQUEST_TIMEOUT",
            );
            assert.equal(failedValue.code, "RUNTIME_CONTROL_REQUEST_TIMEOUT");
          });

          '''
          if tests.count(marker) != 1:
              raise SystemExit("test insertion marker did not match exactly once")
          test_path.write_text(tests.replace(marker, addition + marker))

      - name: Build direct dependencies
        run: npm run build -w @loomrealm/foundation -w @loomrealm/wire -w @loomrealm/platform-ports -w @loomrealm/runtime-control

      - name: Verify Subsystem package
        run: npm test -w @loomrealm/subsystem

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/subsystem-race-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(subsystem): make terminal failure classification single-owner"
          git push origin HEAD:feat/subsystem-m4
