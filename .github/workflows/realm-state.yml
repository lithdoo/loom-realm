name: Realm State v1 qualification

on:
  pull_request:
    paths:
      - "packages/realm-state/**"
      - "packages/game-package/**"
      - "packages/game-launcher-pwa/**"
      - "packages/game-launcher-hostra/**"
      - "packages/subsystem/**"
      - "packages/main/**"
      - "apps/desktop/**"
      - "test/realm-state-v1/**"
      - "doc/10-architecture/realm-state-system.md"
      - "doc/15-contracts/realm-state-v1.md"
      - "doc/30-implementation/realm-state-v1-*"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/realm-state.yml"
      - ".github/actions/setup-workspace/**"
  push:
    branches: [main]
    paths:
      - "packages/realm-state/**"
      - "packages/game-package/**"
      - "packages/game-launcher-pwa/**"
      - "packages/game-launcher-hostra/**"
      - "packages/subsystem/**"
      - "packages/main/**"
      - "apps/desktop/**"
      - "test/realm-state-v1/**"
      - "doc/10-architecture/realm-state-system.md"
      - "doc/15-contracts/realm-state-v1.md"
      - "doc/30-implementation/realm-state-v1-*"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/realm-state.yml"
      - ".github/actions/setup-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
      - name: Run Realm State package and vertical tests
        run: npm run test:realm-state
      - name: Run frozen-contract boundary qualification
        run: npm run test:realm-state:qualification
      - name: Run Desktop composition tests
        run: npm test -w @loomrealm/desktop
      - name: Verify publishable surfaces
        run: npm pack -w @loomrealm/realm-state -w @loomrealm/game-launcher-pwa --dry-run
