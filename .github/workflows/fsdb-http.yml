name: fsdb-http conformance

on:
  pull_request:
    paths:
      - "packages/fsdb-http/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/fsdb-http.yml"
      - ".github/actions/setup-workspace/**"
  push:
    branches: [main]
    paths:
      - "packages/fsdb-http/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/fsdb-http.yml"
      - ".github/actions/setup-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}

      - name: Run fsdb-http mandatory conformance
        run: npm test -w @loomrealm/fsdb-http
