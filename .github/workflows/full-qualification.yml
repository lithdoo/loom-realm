name: Full Qualification

on:
  workflow_dispatch:
    inputs:
      performance_full:
        description: Run the full Desktop performance profile
        required: false
        default: true
        type: boolean

concurrency:
  group: full-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
      - name: Install repository-pinned Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          chromium_path="$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          test -x "$chromium_path"
          printf 'LOOMREALM_CHROMIUM_PATH=%s\n' "$chromium_path" >> "$GITHUB_ENV"
      - name: Run full Linux capability qualification
        env:
          LOOMREALM_QUALIFICATION_REPORT: "1"
        run: node scripts/ci/run-capability.mjs full-linux session-events

  windows:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
      - name: Run full Windows-sensitive qualification
        run: node scripts/ci/run-capability.mjs full-windows

  desktop:
    name: Desktop / frozen Hostra / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check out frozen Hostra
        uses: actions/checkout@v6
        with:
          repository: lithdoo/hostra
          ref: d863beab3c59c3bd4f271514a228fa8fee0bf5b6
          path: .qualification/hostra
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - name: Install Chromium and frozen Hostra runtime
        run: |
          npx playwright install --with-deps chromium
          npm ci --prefix .qualification/hostra --no-audit --no-fund
          test -x .qualification/hostra/packages/hostra/electron_bin/electron
          sandbox=.qualification/hostra/packages/hostra/electron_bin/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = "0:0:4755"
      - name: Run full Desktop product qualification
        env:
          LOOMREALM_QUALIFICATION_REPORT: "1"
          LOOMREALM_M15_FULL_QUALIFICATION: ${{ inputs.performance_full && '1' || '0' }}
          HOSTRA_SOURCE_DIR: ${{ github.workspace }}/.qualification/hostra
        run: xvfb-run -a node scripts/ci/run-capability.mjs desktop-full

  summary:
    name: Full Qualification / summary
    needs: [linux, windows, desktop]
    if: always()
    runs-on: ubuntu-latest
    env:
      LINUX_RESULT: ${{ needs.linux.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
    steps:
      - name: Require all requested evidence to succeed
        shell: bash
        run: |
          for result in "$LINUX_RESULT" "$WINDOWS_RESULT" "$DESKTOP_RESULT"; do
            if [ "$result" != success ]; then
              printf 'Required qualification job did not succeed: %s\n' "$result" >&2
              exit 1
            fi
          done
