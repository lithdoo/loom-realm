name: Main package

on:
  pull_request:
    paths:
      - "packages/main/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "packages/platform-ports/**"
      - "packages/runtime-control/**"
      - "packages/renderer-control/**"
      - "packages/data/**"
      - "packages/renderer/**"
      - "packages/subsystem/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/main-package.yml"
      - ".github/actions/setup-workspace/**"
  push:
    branches:
      - main
    paths:
      - "packages/main/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "packages/platform-ports/**"
      - "packages/runtime-control/**"
      - "packages/renderer-control/**"
      - "packages/data/**"
      - "packages/renderer/**"
      - "packages/subsystem/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/main-package.yml"
      - ".github/actions/setup-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}

      - name: Build Main dependencies
        run: >-
          npm run build
          -w @loomrealm/foundation
          -w @loomrealm/wire
          -w @loomrealm/platform-ports
          -w @loomrealm/runtime-control
          -w @loomrealm/renderer-control
          -w @loomrealm/data
          -w @loomrealm/renderer
          -w @loomrealm/subsystem

      - name: Test Main
        run: npm test -w @loomrealm/main

      - name: Verify publishable package surface
        run: npm pack -w @loomrealm/main --dry-run
