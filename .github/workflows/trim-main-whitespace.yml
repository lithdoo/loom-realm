name: Trim Main shutdown patch whitespace

on:
  push:
    branches:
      - feat/main-m5
    paths:
      - ".github/workflows/trim-main-whitespace.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/main-m5
      - name: Trim trailing whitespace
        run: |
          sed -i 's/[[:space:]]\+$//' packages/main/src/internal/main-session.ts
      - name: Remove one-shot workflow and commit formatting
        run: |
          rm .github/workflows/trim-main-whitespace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/main/src/internal/main-session.ts .github/workflows/trim-main-whitespace.yml
          git commit -m "style(main): trim shutdown cleanup whitespace"
          git push origin HEAD:feat/main-m5
