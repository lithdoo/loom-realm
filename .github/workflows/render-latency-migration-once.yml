name: One-time final root Markdown relocation
on:
  push:
    branches: [docs/remove-root-milestone-reports]
    paths: [.github/workflows/render-latency-migration-once.yml]
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'lithdoo/loom-realm' && github.ref == 'refs/heads/docs/remove-root-milestone-reports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          git merge-base --is-ancestor 2d465b8c8501566b26375dae55e1a78007606c40 HEAD
          python3 scripts/relocate-render-latency-once.py
          git diff --check
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - shell: bash
        run: |
          npm run docs:check-links
          npm run docs:build
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'docs: relocate final root latency specification and update references'
          git push origin HEAD:refs/heads/docs/remove-root-milestone-reports
