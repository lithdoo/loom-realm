name: Platform instance facts closure

on:
  push:
    branches:
      - docs/platform-instance-composition
    paths:
      - "tools/close-platform-instance-facts.py"
      - ".github/workflows/platform-instance-facts-closure.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v6
        with:
          ref: docs/platform-instance-composition

      - name: Apply documentation closure
        run: python tools/close-platform-instance-facts.py

      - name: Check documentation links
        run: node scripts/run-python.mjs scripts/check-doc-links.py

      - name: Remove one-shot files and commit
        run: |
          rm tools/close-platform-instance-facts.py
          rm .github/workflows/platform-instance-facts-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc packages .github/workflows/platform-instance-facts-closure.yml tools/close-platform-instance-facts.py
          git commit -m "docs(platform): close concrete platform composition facts"
          git push origin HEAD:docs/platform-instance-composition
