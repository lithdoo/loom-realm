name: Finalize platform-port rules once

on:
  push:
    branches:
      - feat/platform-ports-m4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/platform-ports-m4
          fetch-depth: 0
      - name: Align platform-port ownership rules
        run: python .github/finalize-platform-ports-rules-once.py
      - name: Commit rule alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/30-implementation/package-architecture.md doc/30-implementation/repository-layout.md
          git diff --cached --check
          git commit -m "docs(platform-ports): align placement rules with frozen boundary"
          git push origin HEAD:feat/platform-ports-m4
