name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - "game-libs/map/*.md"
      - "examples/**/*.md"
      - "packages/**/*.md"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/actions/setup-workspace/**"
      - "scripts/check-doc-links.py"
      - "scripts/check-retired-doc-links.py"
      - "scripts/run-python.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: 24
      - name: Build VitePress site
        run: npm run docs:build
      - name: Verify build entrypoint
        run: test -f doc/.vitepress/dist/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: doc/.vitepress/dist

  deploy:
    name: Deploy documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --location --retry 10 --retry-delay 6 --retry-all-errors "$PAGE_URL"
