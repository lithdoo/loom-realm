name: M15 Desktop full E2E qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check out frozen Hostra
        uses: actions/checkout@v6
        with:
          repository: lithdoo/hostra
          ref: d863beab3c59c3bd4f271514a228fa8fee0bf5b6
          path: .qualification/hostra
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}
      - name: Install Chromium and frozen Hostra runtime
        run: |
          npx playwright install --with-deps chromium
          npm ci --prefix .qualification/hostra --no-audit --no-fund
          test -x .qualification/hostra/packages/hostra/electron_bin/electron
      - name: Run M15 canonical closure gate
        env:
          LOOMREALM_QUALIFICATION_REPORT: "1"
          HOSTRA_SOURCE_DIR: ${{ github.workspace }}/.qualification/hostra
        run: |
          mkdir -p artifacts
          set -o pipefail
          xvfb-run -a npm run test:m15 | tee artifacts/m15-desktop-node-${{ matrix.node }}.tap
      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m15-desktop-node-${{ matrix.node }}
          path: artifacts/m15-desktop-node-${{ matrix.node }}.tap
          if-no-files-found: error
