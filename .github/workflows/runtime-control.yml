name: Runtime Control conformance

on:
  pull_request:
    paths:
      - "packages/runtime-control/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runtime-control.yml"
  push:
    branches: [main]
    paths:
      - "packages/runtime-control/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runtime-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Foundation, Wire, and Runtime Control conformance
        run: npm run test:runtime-control
      - name: Verify publishable package surface
        run: npm pack -w @loomrealm/runtime-control --dry-run
