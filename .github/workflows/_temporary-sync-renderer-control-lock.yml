name: Temporary renderer-control lockfile sync

on:
  push:
    branches:
      - feat/renderer-control-empty-package

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/renderer-control-empty-package
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "chore: sync renderer-control workspace lockfile"
          git push origin HEAD:feat/renderer-control-empty-package
