name: Subsystem package

on:
  pull_request:
    paths:
      - "packages/subsystem/**"
      - "packages/platform-ports/**"
      - "packages/runtime-control/**"
      - "packages/data/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/subsystem.yml"
      - ".github/actions/setup-workspace/**"
  push:
    branches:
      - main
    paths:
      - "packages/subsystem/**"
      - "packages/platform-ports/**"
      - "packages/runtime-control/**"
      - "packages/data/**"
      - "packages/foundation/**"
      - "packages/wire/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/subsystem.yml"
      - ".github/actions/setup-workspace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node }}

      - name: Build Subsystem dependencies
        run: npm run build -w @loomrealm/foundation -w @loomrealm/wire -w @loomrealm/platform-ports -w @loomrealm/runtime-control -w @loomrealm/data

      - name: Test Subsystem
        run: npm test -w @loomrealm/subsystem

      - name: Verify publishable package surface
        run: npm pack -w @loomrealm/subsystem --dry-run
