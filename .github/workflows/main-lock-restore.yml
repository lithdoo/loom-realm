name: Main lockfile minimality restore

on:
  push:
    branches:
      - feat/main-package-scaffold
    paths:
      - ".github/workflows/main-lock-restore.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scaffold branch
        uses: actions/checkout@v6
        with:
          ref: feat/main-package-scaffold

      - name: Restore unrelated Rollup lock metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("package-lock.json")
          text = path.read_text()
          start_marker = '    "node_modules/@rollup/rollup-linux-x64-gnu": {'
          end_marker = '    "node_modules/@rollup/rollup-win32-x64-gnu": {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          old = '      "os": [\n        "linux"\n      ]\n'
          new = '      "os": [\n        "linux"\n      ],\n      "libc": [\n        "glibc"\n      ]\n'
          assert block.count(old) == 1
          block = block.replace(old, new)
          path.write_text(text[:start] + block + text[end:])
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/main-lock-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/main-lock-restore.yml
          git commit -m "chore(main): keep lockfile scaffold-only"
          git push origin HEAD:feat/main-package-scaffold
